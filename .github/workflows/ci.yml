name: Validate R2R CRM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Validate JavaScript
        run: npm run check && npm run check:backend

      - name: Run root smoke test
        run: npm test

      - name: Run backend tests
        run: npm run test:backend

      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            echo "Docker build attempt ${attempt}/3"
            if docker build -t r2r-crm-saas:${{ github.sha }} .; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Test container health
        run: |
          docker run -d --rm --name r2r-crm-test -p 3000:3000 \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e HOST=0.0.0.0 \
            -e ALLOW_DEMO_AUTH=true \
            r2r-crm-saas:${{ github.sha }}
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker logs r2r-crm-test || true
          exit 1

  deploy-easypanel:
    name: Deploy EasyPanel
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger EasyPanel deployment
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "::warning::EASYPANEL_DEPLOY_URL is not configured; relying on EasyPanel automatic GitHub deployment."
            exit 0
          fi
          status="$(curl --show-error --silent --output deploy-response.txt --write-out '%{http_code}' --request POST "$EASYPANEL_DEPLOY_URL" || true)"
          if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "EasyPanel accepted the deployment request (HTTP $status)."
            exit 0
          fi
          echo "::warning::EasyPanel webhook returned HTTP ${status:-000}; relying on automatic GitHub deployment."
