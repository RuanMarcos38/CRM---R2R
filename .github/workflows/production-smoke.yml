name: Production SSL and API smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for EasyPanel auto deploy and check app endpoint
        env:
          R2R_API_HOST: r2rmarketingdigital-crmbackend.ke4n49.easypanel.host
        run: |
          for attempt in {1..12}; do
            echo "EasyPanel app check attempt ${attempt}/12"
            if node scripts/check-production.mjs; then
              exit 0
            fi
            sleep 30
          done
          echo "EasyPanel app did not become healthy after 6 minutes."
          exit 1

      - name: Diagnose custom CRM domain
        continue-on-error: true
        env:
          R2R_API_HOST: crm.r2rmarketingdigital.com.br
        run: node scripts/check-production.mjs
