name: Production SSL and API smoke test

on:
  workflow_run:
    workflows: ["Validate R2R CRM"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Wait for EasyPanel auto deploy and check app endpoint
        env:
          R2R_API_HOST: r2rmarketingdigital-crmbackend.ke4n49.easypanel.host
          R2R_CHECK_TIMEOUT_MS: 30000
        run: |
          for attempt in {1..20}; do
            echo "EasyPanel app check attempt ${attempt}/20"
            if node scripts/check-production.mjs; then
              exit 0
            fi
            sleep 45
          done
          echo "EasyPanel app did not become healthy after 15 minutes."
          exit 1

      - name: Diagnose custom CRM domain
        continue-on-error: true
        env:
          R2R_API_HOST: crm.r2rmarketingdigital.com.br
          R2R_CHECK_TIMEOUT_MS: 30000
        run: node scripts/check-production.mjs
